name: Update reference links

on:
  push:
    paths:
      - .github/workflows/update-reference-links.yml

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add all reference links
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.js")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '''      { title: "Dangerously Hot Glass", src: "reference_images/first_visit_dangerously_hot_glass.jpg" }
''': '''      { title: "Dangerously Hot Glass", src: "reference_images/first_visit_dangerously_hot_glass.jpg" },
      { title: "Wraith Mirror", src: "reference_images/first_visit_wraith_mirror.jpg" }
''',
              '''      { title: "Wagon Door", src: "reference_images/return_wagon_door.jpg" }
''': '''      { title: "Wagon Door", src: "reference_images/return_wagon_door.jpg" },
      { title: "Impossibly Deep Interior", src: "reference_images/return_Impossibly Deep Interior.jpg" },
      { title: "Ilona's Departure", src: "reference_images/return_ Ilona's Departure.jpg" }
''',
              '''    id: "cure", title: "The Cure", kind: "Gloamglass memory III", cols: 12, rows: 8, references: [],
''': '''    id: "cure", title: "The Cure", kind: "Gloamglass memory III", cols: 12, rows: 8,
    references: [
      { title: "Open Mirror Enclosure", src: "reference_images/cure_Open Mirror Enclosure.jpg" },
      { title: "Alignment Mirror", src: "reference_images/cure_Alignment Mirror.jpg" },
      { title: "Open Alignment and Hall Entrance", src: "reference_images/cure_Open Alignment and Hall entrence.jpg" }
    ],
''',
              '''    id: "unmade-screams", title: "Hall of Unmade Screams", kind: "Tactical finale", cols: 14, rows: 10, references: [],
''': '''    id: "unmade-screams", title: "Hall of Unmade Screams", kind: "Tactical finale", cols: 14, rows: 10,
    references: [
      { title: "Anchor", src: "reference_images/unmade_Anchor.jpg" },
      { title: "Lantern Area and Terminal Mirror", src: "reference_images/unmade_Lantern Area and Terminal Mirror.jpg" },
      { title: "Open Nave", src: "reference_images/unmade_The open Nave.jpg" }
    ],
''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected source block not found: {old[:80]!r}")
              text = text.replace(old, new, 1)
          if text.count('src: "reference_images/') != 13:
              raise SystemExit("Reference count is not 13")
          path.write_text(text, encoding="utf-8")
      - name: Commit update and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/update-reference-links.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js .github/workflows/update-reference-links.yml
          git commit -m 'Add all Gloamglass reference links'
          git push
